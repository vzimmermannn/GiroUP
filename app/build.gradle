plugins { id 'com.android.application' }
android {
 namespace 'br.com.giroup'
 compileSdk 35
 defaultConfig { applicationId 'br.com.giroup'; minSdk 26; targetSdk 35; versionCode 2; versionName '2.0-mvp' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 if (System.getenv('GIROUP_KEYSTORE')) {
  signingConfigs { mvp { storeFile file(System.getenv('GIROUP_KEYSTORE')); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
  buildTypes { debug { signingConfig signingConfigs.mvp } }
 }
}
dependencies {
 implementation 'androidx.core:core:1.13.1'
 implementation 'com.google.mlkit:text-recognition:16.0.1'
 implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
configurations.configureEach {
 resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
}
